; Dev API uses `php artisan serve` (CLI SAPI). Without CLI OPcache,
; every request recompiles Laravel from the Windows bind mount (~3–6s).
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Avoid per-request timestamp scans on Windows bind mounts (that alone was ~3s).
; Restart the api container after PHP changes if they are not picked up.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.save_comments=1
